name: Go CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - run: go mod tidy
      - run: test -z "$(gofmt -l ./cmd ./internal)"
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/worker
